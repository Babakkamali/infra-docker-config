version: '3.3'

services:
  mssql:
    container_name: sql-server
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      ACCEPT_EULA: "Y"s
      MSSQL_SA_PASSWORD: "generated-password"
    ports:
      - 1433:1433
    volumes:
      - mssql:/var/opt/mssqli
volumes:
  mssql:
    external: true