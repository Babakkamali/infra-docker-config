route:
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 3h
    receiver: 'slack'

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, cluster, service]
receivers:
    - name: 'slack'
      slack_configs:
          - send_resolved: true
            text: "{{ .CommonAnnotations.description }}"
            username: 'Prometheus'
            channel: '#prometheus'
            api_url: 'YOUR_SLACK_API_URI'
    - name: 'telegram'
      telegram_configs:
          - send_resolved: true
            api_url: "https://api.telegram.org"
            bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
            chat_id: YOUR_TELEGRAM_CHAT_ID
            message: '{{ template "telegram.myorg.text" .}}'

templates:
- '/etc/alertmanager/templates/telegram_custom_template.tmpl'