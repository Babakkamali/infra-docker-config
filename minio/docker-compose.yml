version: '3.7'

services:
  minio1:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    command: server --console-address ":9001" /data1
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    expose:
      - "9000"
      - "9001"
    # environment:
      # MINIO_ROOT_USER: minioadmin
      # MINIO_ROOT_PASSWORD: minioadmin
    hostname: minio1
    volumes:
      - /media/sdb/test:/data1
    ports:
      - 9000:9000
      - 9001:9001