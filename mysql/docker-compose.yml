version: '3.8'
services:
  mysql-db:
    image: mysql:8.0.30
    cap_add:
      - SYS_NICE
    restart: always
    environment:
      - MYSQL_DATABASE=dbname
      - MYSQL_USER=dbuser
      - MYSQL_PASSWORD=dbpass
      - MYSQL_ROOT_PASSWORD=rootpass
    ports:
      - '3306:3306'
    volumes:
      - mysql-db:/var/lib/mysql

volumes:
  mysql-db:
    driver: local