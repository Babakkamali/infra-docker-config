version: '3'
services:
 redis-slave:
  container_name: redis-slave
  image: redis:latest
  restart: always
  hostname: redis-slave
  entrypoint: redis-server --appendonly yes --requirepass $REDIS_PASSWORD --maxmemory 4096mb --maxmemory-policy allkeys-lru --slaveof $REDIS_MASTER_HOST $REDIS_MASTER_PORT --masterauth $REDIS_MASTER_PASSWORD
  networks:
    - redis-network
  ports:
    - "6379:6379"
  environment:
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - REDIS_MASTER_HOST=${REDIS_MASTER_HOST}
    - REDIS_MASTER_PORT=${REDIS_MASTER_PORT}
    - REDIS_MASTER_PASSWORD=${REDIS_MASTER_PASSWORD}
    - REDIS_SLAVE_OF=yes
    - REDIS_PORT=${REDIS_PORT}
  volumes:
    - redis_slave:/data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
  healthcheck:
    test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "--raw", "get", "ping" ]
    interval: 10s
    timeout: 5s
    retries: 5

volumes:
  redis_slave:

networks:
  redis-network:
    external: true