version: "3.9"
services:
  mongo:
    container_name: mongo
    image: mongo:4.2
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - /etc/localtime:/etc/localtime:ro
        #      - /opt/mongo-backup:/backup
        #      - /opt/mongo-backup.sh:/backup.sh:ro
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    restart: unless-stopped
    volumes:
      - es_data:/usr/share/elasticsearch/data
    environment:
      http.host: 0.0.0.0
      transport.host: localhost
      network.host: 0.0.0.0
      ES_JAVA_OPTS: -Dlog4j2.formatMsgNoLookups=true -Xms1024m -Xmx1024m
    ulimits:
      memlock:
        soft: -1
        hard: -1
  graylog:
    container_name: graylog
    image: graylog/graylog:4.2
    restart: unless-stopped
    environment:
      GRAYLOG_PASSWORD_SECRET: change-me
      GRAYLOG_ROOT_PASSWORD_SHA2: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      GRAYLOG_HTTP_EXTERNAL_URI: http://192.168.1.1/
#      GRAYLOG_TIMEZONE: Asia/Tehran
      GRAYLOG_ROOT_TIMEZONE: Asia/Tehran
    entrypoint: /usr/bin/tini -- wait-for-it elasticsearch:9200 -- /docker-entrypoint.sh
    depends_on:
      - mongo
      - elasticsearch
    ports:
      - 80:9000
      # Syslog TCP
      - 1514:1514
      # Syslog UDP
      - 1514:1514/udp
      # HAproxy TCP
      - 1515:1515
      # HAproxy UDP
      - 1515:1515/udp
    volumes:
      - graylog_data:/usr/share/graylog/data

volumes:
  es_data:
    driver: local
  graylog_data:
    driver: local
  mongo_data:
    driver: local